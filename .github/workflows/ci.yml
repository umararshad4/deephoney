name: macOS checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Cache Cargo files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-stable-${{ hashFiles('Cargo.lock') }}
      - name: Test workspace
        run: cargo +stable test --workspace --locked
      - name: Lint all targets
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo +stable metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "app") | .version')
          test "$RELEASE_TAG" = "v$version"
          grep -F "## [$version]" CHANGELOG.md
